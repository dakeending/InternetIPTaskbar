name: Release

# Run by pushing a tag such as v2.0.1 (see docs/RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content src/InternetIPTaskbar/InternetIPTaskbar.csproj)
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) { throw "Tag v$tag does not match <Version> $version in the csproj." }

      - name: Test
        run: dotnet test -c Release -p:TreatWarningsAsErrors=true

      - name: Download country flags to embed
        shell: pwsh
        run: ./scripts/fetch-flags.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii artifacts/SHA256SUMS.txt
          }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
